<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Game masak warung mie pedas: layani pelanggan, naik level, beli fasilitas dan rekrut karyawan.">
<title>Dapur Mie Rawit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: cartoon cross-section of a warung — dining wall with menu board and queue of customers on top, wooden counter with cash register and trays in the middle, tiled kitchen with stoves, wok and ice dispenser below. One committed light look with thick brown outlines. */
:root{
  --ol:#3a2316; --wall:#ffd76e; --wall-2:#ffc94a; --stripe:#ffe39a;
  --wood:#c8743a; --wood-top:#e3924f; --wood-dark:#8a4b22;
  --tile:#f4f7fb; --grout:#bfd0e6; --steel:#c9ced8;
  --chili:#e2412b; --chili-dark:#a82a17; --sambal:#f5a524; --leaf:#2ea25f; --leaf-dark:#1d7343;
  --blue:#2f63c9; --blue-dark:#1d418f; --paper:#fffaf0; --ink:#3a2316; --muted:#7a6252;
  --sky:#2a1a4a;
  --display:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:radial-gradient(circle at 50% 0%,#4a2f7a 0%,var(--sky) 70%) fixed;background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.3;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--sambal);outline-offset:2px}
svg{display:block;overflow:visible}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:12px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 28px}
@media (min-width:420px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;color:#fff}
.logo b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:#ffd76e;text-shadow:0 3px 0 var(--chili-dark),0 0 0 var(--ol);-webkit-text-stroke:1.5px var(--ol);paint-order:stroke fill}
.logo small{display:block;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#d9c8ff}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{background:var(--paper);border:3px solid var(--ol);border-radius:14px;padding:2px 10px 3px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ol)}
.pill .pi{font-size:18px}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1}
.pill b{display:block;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.hearts{color:var(--chili);letter-spacing:1px}
.hbtn{background:var(--sambal);border:3px solid var(--ol);border-radius:12px;padding:5px 10px;font-weight:800;box-shadow:0 3px 0 var(--ol)}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}

/* Scene */
.scene{border:4px solid var(--ol);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.dining{background:repeating-linear-gradient(90deg,var(--wall) 0 34px,var(--stripe) 34px 68px);padding:12px 14px 0;position:relative}
.deco{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.board{background:#2f3b33;border:5px solid var(--wood-dark);border-radius:10px;color:#f5f1e3;padding:6px 12px 8px;box-shadow:0 4px 0 rgba(0,0,0,.25);min-width:0}
.board h3{font-family:var(--display);font-weight:400;margin:0 0 3px;color:#ffd76e;font-size:16px;letter-spacing:.06em}
.board ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,auto);gap:0 16px;font-size:12.5px;font-weight:600}
.board li{display:flex;justify-content:space-between;gap:10px}
.board li span:last-child{color:#ffd76e;font-variant-numeric:tabular-nums}
.popsign{background:var(--chili);color:#fff;border:4px solid var(--ol);border-radius:14px;padding:5px 12px;text-align:center;box-shadow:0 4px 0 var(--ol);transform:rotate(-2deg)}
.popsign small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.popsign b{font-size:20px;letter-spacing:2px;color:#ffd76e}
.queue{display:grid;grid-template-columns:repeat(var(--seats),minmax(0,1fr));gap:8px;margin-top:8px;align-items:end;min-height:250px}
@media (max-width:700px){.queue{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
.spot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-height:250px;position:relative;text-align:center;border-radius:16px;padding:4px 2px 0}
button.spot:hover:not(:disabled) .bubble{border-color:var(--sambal);transform:translateY(-3px)}
.spot.empty{color:rgba(58,35,22,.45);font-weight:800;justify-content:center;font-size:13px}
.spot.empty::after{content:"";width:70%;height:12px;border-radius:50%;background:rgba(58,35,22,.12);margin-top:8px}
.bubble{background:#fff;border:3px solid var(--ol);border-radius:16px;padding:5px 6px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;position:relative;max-width:100%;transition:transform .12s,border-color .12s;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:3px solid var(--ol);border-bottom:3px solid var(--ol);transform:translateX(-50%) rotate(45deg)}
.bubble.vip{background:#fff6cf;border-color:#a86f00}
.bubble.vip::after{background:#fff6cf;border-color:#a86f00}
.oi{position:relative;width:40px;height:44px;display:flex;flex-direction:column;align-items:center;z-index:1}
.oi svg{width:36px;height:36px}
.oi .lv{font-size:10px;font-weight:800;border:2px solid var(--ol);border-radius:7px;padding:0 4px;line-height:1.2;margin-top:-6px}
.oi.done{opacity:.4}
.oi.done::after{content:"✓";position:absolute;top:2px;left:50%;transform:translateX(-50%);color:#fff;background:var(--leaf);border:2px solid var(--ol);border-radius:50%;width:22px;height:22px;font-weight:800;font-size:13px;line-height:18px}
.oi.done{opacity:1}.oi.done svg{opacity:.35}
.cust{width:76px;margin-top:8px}
.cust svg{width:76px;height:106px}
.spot.enter .cust{animation:walkIn .6s ease-out}
.spot.leave{pointer-events:none}
.spot.leave .cust{animation:walkOut 1.1s ease-in forwards}
.spot.leave .bubble{animation:fade 1.1s forwards}
.spot.urgent .cust{animation:shake .45s infinite}
.cname{font-weight:800;font-size:12px;background:var(--paper);border:2px solid var(--ol);border-radius:8px;padding:0 6px;margin-top:-6px;position:relative;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cname.vip{background:#ffd76e}
.patience{width:80%;height:9px;border:2px solid var(--ol);border-radius:9px;background:#fff;overflow:hidden;margin-bottom:6px}
.patience i{display:block;height:100%;background:var(--leaf);transition:background .3s}
.patience.mid i{background:var(--sambal)} .patience.low i{background:var(--chili)}

/* Counter */
.counter{background:var(--wood);border-top:10px solid var(--wood-top);border-bottom:6px solid var(--wood-dark);padding:10px 14px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;position:relative}
.counter::before{content:"";position:absolute;inset:-10px 0 auto 0;height:3px;background:var(--ol)}
.register{width:150px;flex:none;position:relative}
.register svg{width:150px;height:118px}
.register.ching svg{animation:ching .45s}
.trays{flex:1;display:flex;flex-wrap:wrap;gap:10px;min-width:0}
.tray{flex:1 1 220px;background:#a33b2a;border:3px solid var(--ol);border-radius:18px;padding:8px 22px;position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;box-shadow:inset 0 0 0 4px #c34c37,0 4px 0 rgba(0,0,0,.25);min-height:74px}
.tray::before,.tray::after{content:"";position:absolute;top:50%;width:10px;height:26px;border:3px solid var(--ol);background:#8a2f20;border-radius:6px;transform:translateY(-50%)}
.tray::before{left:-8px}.tray::after{right:-8px}
.titem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .25s ease-out}
.titem svg{width:44px;height:44px}
.titem .lv{font-size:10px;font-weight:800;border:2px solid var(--ol);border-radius:7px;padding:0 4px;line-height:1.2;margin-top:-6px;background:#fff}
.tslot{border:2px dashed rgba(255,255,255,.35);border-radius:12px;min-height:52px}
.x{position:absolute;top:-6px;right:-4px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ol);font-size:11px;font-weight:900;line-height:16px;color:var(--chili)}
.helper{display:flex;flex-direction:column;align-items:center;width:70px;flex:none}
.helper svg{width:64px;height:90px}
.helper.work svg{animation:bob .35s 2}
.htag{font-size:10.5px;font-weight:800;background:#fff;border:2px solid var(--ol);border-radius:7px;padding:0 5px;margin-top:-4px;white-space:nowrap}
.counter .label{position:absolute;top:-34px;right:14px;font-family:var(--display);color:#fff;-webkit-text-stroke:1px var(--ol);paint-order:stroke fill;font-size:14px;letter-spacing:.05em}

/* Kitchen */
.kitchen{background-color:var(--tile);background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);background-size:30px 30px;padding:14px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}
@media (max-width:920px){.kitchen{grid-template-columns:1fr}}
.station{background:rgba(255,255,255,.65);border:3px solid var(--ol);border-radius:18px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sign{font-family:var(--display);font-weight:400;font-size:17px;background:var(--wood-top);color:#fff;border:3px solid var(--ol);border-radius:10px;padding:1px 10px;-webkit-text-stroke:.6px var(--ol);paint-order:stroke fill;box-shadow:0 3px 0 var(--ol)}
.sh .staffmini{display:flex;align-items:flex-end;gap:4px}
.sh .staffmini svg{width:42px;height:58px}
.sh .staffmini.work svg{animation:bob .35s 2}
.sh .staffmini span{font-size:10.5px;font-weight:800;background:#fff;border:2px solid var(--ol);border-radius:7px;padding:0 5px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:3px solid var(--ol);border-radius:16px;padding:6px 6px 8px;position:relative;min-width:0}
.unit.ready{background:#fff4d6;box-shadow:0 0 0 3px var(--sambal)}
.unit.bad{background:#ffe3dd;box-shadow:0 0 0 3px var(--chili)}
.unit.locked{opacity:.55;justify-content:center;min-height:150px;font-weight:800;color:var(--muted);text-align:center}
.unit .art{width:112px;height:100px}
.unit .cap{font-weight:800;font-size:12.5px;text-align:center}
.prog{width:100%;height:10px;border:2px solid var(--ol);border-radius:8px;background:#eee;overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf)}
.prog.hot i{background:var(--chili)}
.gbtn{font-family:var(--display);font-weight:400;font-size:15px;color:#fff;background:var(--chili);border:3px solid var(--ol);border-radius:12px;padding:5px 10px;box-shadow:0 4px 0 var(--ol);-webkit-text-stroke:.5px var(--ol);paint-order:stroke fill;width:100%}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.gbtn.blue{background:var(--blue)}
.spices{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.sp{width:34px;height:34px;border:3px solid var(--ol);border-radius:10px;font-weight:900;font-size:13px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ol)}
.sp small{font-size:8px;font-weight:800}
.sp:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.picks{display:flex;flex-direction:column;gap:4px;width:100%}
.pick{display:flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--ol);border-radius:10px;padding:1px 6px 1px 2px;font-weight:800;font-size:12px;text-align:left;box-shadow:0 2px 0 var(--ol)}
.pick svg{width:26px;height:26px;flex:none}
.pick small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.pick:active{transform:translateY(2px);box-shadow:none}

/* SVG animation hooks */
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s infinite alternate}
.flame:nth-child(2){animation-delay:.1s}.flame:nth-child(3){animation-delay:.05s}
.bub{animation:bubble 1s infinite}
.bub:nth-child(2){animation-delay:.3s}.bub:nth-child(3){animation-delay:.6s}
.steam path{animation:steam 1.4s infinite}
.steam path:nth-child(2){animation-delay:.45s}.steam path:nth-child(3){animation-delay:.9s}
.sizzle{animation:sizzle .3s infinite alternate}
.fill{transform-box:fill-box;transform-origin:50% 100%}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(26,14,46,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:620px;max-height:100%;overflow:auto;background:var(--paper);border:6px solid var(--wood-dark);outline:3px solid var(--ol);border-radius:26px;padding:20px 20px 18px;box-shadow:0 10px 0 rgba(0,0,0,.35);animation:pop .25s ease-out}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,8vw,56px);line-height:.95;margin:2px 0 10px;color:#ffd76e;-webkit-text-stroke:2px var(--ol);paint-order:stroke fill;text-shadow:0 5px 0 var(--chili);text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:2px 0 10px;color:var(--chili);text-wrap:balance}
.card p{margin:0 0 10px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.hero{display:flex;align-items:flex-end;gap:6px;justify-content:center;margin:4px 0 6px}
.hero svg{width:90px;height:126px}
.hero .bowl svg{width:80px;height:80px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{font-family:var(--display);font-weight:400;font-size:18px;color:#fff;background:var(--chili);border:3px solid var(--ol);border-radius:14px;padding:8px 16px;box-shadow:0 5px 0 var(--ol);-webkit-text-stroke:.6px var(--ol);paint-order:stroke fill}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.btn.green{background:var(--leaf)} .btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--ink);-webkit-text-stroke:0}
.btn:disabled{background:#cfc6bd;color:#857a70;-webkit-text-stroke:0;box-shadow:0 5px 0 #8f857c;border-color:#8f857c}
.steps{list-style:none;padding:0;margin:6px 0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;counter-increment:s;background:#fff;border:3px solid var(--ol);border-radius:16px;padding:8px 10px}
.steps .ill{position:relative;width:64px;height:64px;display:grid;place-items:center}
.steps .ill svg{max-width:64px;max-height:64px}
.steps .ill::before{content:counter(s);position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--chili);color:#fff;border:2px solid var(--ol);font-family:var(--display);font-size:14px;display:grid;place-items:center;z-index:1}
.steps b{display:block;color:var(--chili);font-size:15.5px}
.note{background:#fff3cf;border:3px dashed #d9a634;border-radius:14px;padding:9px 12px;font-size:14px;font-weight:600}
.note.hot{background:#ffe3dd;border-color:var(--chili)}
.receipt{display:grid;grid-template-columns:1fr auto;gap:4px 16px;background:#fff;border:3px solid var(--ol);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:600;font-variant-numeric:tabular-nums}
.receipt .tot{border-top:2px dashed var(--muted);padding-top:6px;font-weight:800}
.stars{font-size:42px;letter-spacing:6px;color:#ffc21a;-webkit-text-stroke:2px var(--ol);paint-order:stroke fill;margin:0 0 4px;line-height:1}
.stars .off{color:#e9e0d6}
.tabs{display:flex;gap:6px;margin:4px 0 10px}
.tabs button{padding:6px 14px;border-radius:12px;font-weight:800;background:#fff;border:3px solid var(--ol)}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.shop{display:grid;gap:9px}
.srow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--ol);border-radius:16px;padding:8px 10px}
.srow .ic{width:56px;height:56px;display:grid;place-items:center}
.srow .ic svg{max-width:56px;max-height:56px}
.srow b{display:block;color:var(--ink);font-size:15.5px}
.srow small{display:block;color:var(--muted);font-weight:600;line-height:1.25}
.srow .popc{color:var(--chili);font-weight:800}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:16px;height:8px;border-radius:9px;background:#e9e0d6;border:2px solid var(--ol)} .pips i.on{background:var(--sambal)}
.srow .btn{font-size:14px;padding:6px 10px;white-space:nowrap}
@media (max-width:480px){.srow{grid-template-columns:48px 1fr}.srow .ic{width:48px;height:48px}.srow .btn{grid-column:1/-1}}
.money{font-family:var(--display);color:var(--leaf);font-size:24px}
.list{margin:0 0 8px;padding-left:20px}.list li{margin:3px 0}

.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ol);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
.float{position:fixed;z-index:40;pointer-events:none;font-family:var(--display);font-size:19px;white-space:nowrap;transform:translateX(-50%);animation:floatUp 1.4s ease-out forwards;-webkit-text-stroke:1.5px var(--ol);paint-order:stroke fill}
.float.good{color:#ffe14d}.float.bad{color:#ff8a75}.float.meh{color:#fff;font-size:16px}

@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-64px}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes walkIn{from{transform:translateX(160px);opacity:0}60%{transform:translateX(-6px)}to{transform:none;opacity:1}}
@keyframes walkOut{0%{transform:none;opacity:1}20%{transform:translateY(-8px)}100%{transform:translateX(-180px);opacity:0}}
@keyframes fade{to{opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes ching{30%{transform:scale(1.08) rotate(-3deg)}60%{transform:scale(.97)}}
@keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@keyframes bubble{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-8px);opacity:0}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.85}100%{transform:translateY(-14px);opacity:0}}
@keyframes sizzle{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hud" id="hud"></header>
  <main class="scene">
    <section class="dining">
      <div class="deco" id="deco"></div>
      <div class="queue" id="queue"></div>
    </section>
    <section class="counter" id="counter"></section>
    <section class="kitchen">
      <div class="station"><div class="sh" id="sh-stove"></div><div class="units" id="stoves"></div></div>
      <div class="station"><div class="sh" id="sh-wok"></div><div class="units" id="woks"></div></div>
      <div class="station"><div class="sh" id="sh-drink"></div><div class="units" id="drinks"></div></div>
    </section>
  </main>
</div>
<div class="ov" id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

    drinkChance:Math.min(.95,(n===1?.7:.8)+p*.01),
    snackChance:Math.min(.85,.55+p*.015),
    doubleSnack:n>=4?.3:(p>=6&&n>=2?.15:0),
    doubleNoodle:n>=5?.3:(p>=8?.15:0),
    noNoodle:n>=3?.12:0,
    vip:p>=4?Math.min(.35,.05+p*.015):0};
}
function levelNotes(n){
  const c=levelCfg(n),notes=[];
  if(n===1)notes.push('Menu: Mie Pedas Lv 0–2, Es Teh, dan Es Jeruk.');
  if(n===2)notes.push('Wajan dimsum dibuka: Pangsit Goreng dan Udang Keju.');
  if(n===3)notes.push('Menu baru: Siomay (dikukus) dan Es Leci.');
  if(n===4)notes.push('Sebagian pelanggan memesan 2 dimsum sekaligus.');
  if(n===5)notes.push('Ada yang memesan 2 mangkuk mie.');
  if(n>=6)notes.push('Warung makin ramai, pelanggan datang lebih rapat.');
  notes.push(`Pedas sampai Lv ${c.maxSpice}.`);
  return notes;
}
function genOrder(c){
  const items=[];const skip=c.snacks&&Math.random()<c.noNoodle;
  if(!skip){const nn=Math.random()<c.doubleNoodle?2:1;for(let i=0;i<nn;i++)items.push('mie'+Math.floor(Math.random()*(c.maxSpice+1)));}
  if(c.snacks&&(skip||Math.random()<c.snackChance)){items.push(pick(c.snackPool));if(Math.random()<c.doubleSnack)items.push(pick(c.snackPool));}
  if(skip||Math.random()<c.drinkChance)items.push(pick(c.drinkPool));
  return items;
}

/* ---------- Run ---------- */
let run=null,paused=true,screen='title',lastResult=null,shopTab='upg',confirmReset=false,cid=0,pauseFrom=null;
function makeRun(){
  const cfg=levelCfg(save.level);
  return {cfg,t:0,next:1,spawned:0,served:0,missed:0,score:0,earned:0,tips:0,combo:0,ratios:[],ended:false,ching:0,
    seats:Array.from({length:save.up.seats},()=>null),
    burners:Array.from({length:save.up.burner},()=>({st:'idle',t:0,dur:0})),
    fry:Array.from({length:save.up.fryer},()=>({st:'idle',k:null,t:0,dur:0})),
    drk:Array.from({length:save.up.drink},()=>({st:'idle',k:null,t:0,dur:0})),
    hold:[],holdMax:8,cd:{koki:0,goreng:0,barista:0,pelayan:0},work:{koki:0,goreng:0,barista:0,pelayan:0}};
}
function newCust(items,vip){
  const pat=(run.cfg.patience+4*(items.length-1))*(1+.12*save.up.comfort)*(vip?.75:1);
  return {id:++cid,name:pick(NAMES),look:look(),vip,items:items.map(k=>({k,done:false})),pat,max:pat,leave:0,age:0};
}
function demoRun(){
  run=makeRun();run.demo=true;
  const a=newCust(['mie2','esteh'],false);a.age=9;a.pat=a.max*.8;
  const b=newCust(['mie0','jeruk'],false);b.age=9;b.pat=b.max*.4;
  run.seats[0]=a;run.seats[1]=b;
  run.burners[0]={st:'ready',t:2,dur:5};run.drk[0]={st:'cook',k:'jeruk',t:1.5,dur:3};run.hold=['esteh'];cid=0;
}
function startLevel(){run=makeRun();cid=0;closeOv();renderAll();}
function spawn(){
  const i=run.seats.findIndex(s=>!s);if(i<0)return false;
  run.seats[i]=newCust(genOrder(run.cfg),Math.random()<run.cfg.vip);
  run.spawned++;beep(660,.06);return true;
}
function update(dt){
  const r=run;r.t+=dt;r.ching=Math.max(0,r.ching-dt);
  for(const k in r.work)r.work[k]=Math.max(0,r.work[k]-dt);
  if(r.spawned<r.cfg.quota){r.next-=dt;if(r.next<=0)r.next=spawn()?r.cfg.spawn*rand(.7,1.3):.4;}
  r.seats.forEach((c,i)=>{
    if(!c)return;c.age+=dt;
    if(c.leave>0){c.leave-=dt;if(c.leave<=0)r.seats[i]=null;return;}
    c.pat-=dt;
    if(c.pat<=0){c.pat=0;c.leave=1.1;c.happy=false;r.missed++;r.combo=0;r.score=Math.max(0,r.score-50);floatAt('spot-'+i,'Kabur! −50','bad');beep(170,.25);}
  });
  if(r.missed>=r.cfg.maxMiss){endLevel(false);return;}
  r.burners.forEach(b=>{
    if(b.st==='boil'){b.t+=dt;if(b.t>=b.dur){b.st='ready';b.t=0;beep(880,.05);}}
    else if(b.st==='ready'){b.t+=dt;if(b.t>=NOODLE_HOLD){b.st='soggy';b.t=0;beep(220,.15);}}
  });
  [r.fry,r.drk].forEach(a=>a.forEach(s=>{
    if(s.st==='cook'){s.t+=dt;if(s.t>=s.dur)s.st='done';}
    if(s.st==='done'&&r.hold.length<r.holdMax){r.hold.push(s.k);s.st='idle';s.k=null;beep(990,.04);}
  }));
  staffTick(dt);
  if(r.spawned>=r.cfg.quota&&r.seats.every(s=>!s))endLevel(true);
}

/* ---------- Actions ---------- */
function boil(i){const b=run.burners[i];if(b&&b.st==='idle'){b.st='boil';b.t=0;b.dur=NOODLE_BOIL*spd();}}
function season(i,s){
  const b=run.burners[i];if(!b||b.st!=='ready'||s>run.cfg.maxSpice)return false;
  if(run.hold.length>=run.holdMax){toast('Nampan penuh. Antar atau buang dulu.');return false;}
  run.hold.push('mie'+s);run.burners[i]={st:'idle',t:0,dur:0};beep(520,.05);return true;
}
function startSlot(slot,k){if(slot&&slot.st==='idle'&&MENU[k]){slot.st='cook';slot.k=k;slot.t=0;slot.dur=MENU[k].cook*spd();}}
function serve(i,one){
  const c=run.seats[i];if(!c||c.leave>0)return false;let n=0;
  for(const it of c.items){if(it.done)continue;const h=run.hold.indexOf(it.k);if(h>=0){run.hold.splice(h,1);it.done=true;n++;if(one)break;}}
  if(!n){if(!one)floatAt('spot-'+i,'Belum ada di nampan','meh');return false;}
  beep(740,.05);if(c.items.every(x=>x.done))complete(i);return true;
}
function complete(i){
  const c=run.seats[i],r=run,ratio=c.pat/c.max,n=c.items.length;
  const price=c.items.reduce((s,x)=>s+(x.k.startsWith('mie')?MENU.mie.price:MENU[x.k].price),0);
  const tip=r500(price*.4*ratio*(c.vip?2:1));
  r.combo=ratio>=.5?r.combo+1:0;
  const pts=Math.round((100*n+150*n*ratio)*(c.vip?1.5:1))+(r.combo>1?r.combo*25:0);
  r.score+=pts;r.earned+=price+tip;r.tips+=tip;r.served++;r.ratios.push(ratio);r.ching=.45;
  c.leave=1.1;c.happy=true;
  floatAt('spot-'+i,`+${fmt(price+tip)}${r.combo>1?' · combo x'+r.combo:''}`,'good');
  beep(1046,.08);setTimeout(()=>beep(1318,.1),90);
}

/* ---------- Staff ---------- */
function staffTick(dt){
  const r=run,S=save.staff;
  for(const k in r.cd)r.cd[k]=Math.max(0,r.cd[k]-dt);
  if(!S.koki&&!S.goreng&&!S.barista&&!S.pelayan)return;
  const need={},have={};
  r.seats.forEach(c=>{if(c&&c.leave<=0)c.items.forEach(x=>{if(!x.done)need[x.k]=(need[x.k]||0)+1;});});
  r.hold.forEach(k=>have[k]=(have[k]||0)+1);
  [...r.fry,...r.drk].forEach(s=>{if(s.k)have[s.k]=(have[s.k]||0)+1;});
  const short=k=>(need[k]||0)-(have[k]||0);
  const did=w=>{r.cd[w]=1;r.work[w]=.7;};
  if(S.koki&&r.cd.koki<=0){
    const sg=r.burners.findIndex(b=>b.st==='soggy');
    if(sg>=0){r.burners[sg]={st:'idle',t:0,dur:0};did('koki');}
    else{
      let ok=false;const rd=r.burners.findIndex(b=>b.st==='ready');
      if(rd>=0)for(let s=0;s<=4;s++){if(short('mie'+s)>0&&season(rd,s)){ok=true;break;}}
      if(!ok){let nn=0;for(let s=0;s<=4;s++)nn+=Math.max(0,short('mie'+s));
        const inPot=r.burners.filter(b=>b.st==='boil'||b.st==='ready').length,idle=r.burners.findIndex(b=>b.st==='idle');
        if(idle>=0&&nn>inPot){boil(idle);ok=true;}}
      if(ok)did('koki');
    }
  }
  const station=(w,slots,pool)=>{
    if(!S[w]||r.cd[w]>0)return;const idle=slots.find(s=>s.st==='idle');if(!idle)return;
    const k=pool.find(k=>short(k)>0);if(!k)return;startSlot(idle,k);have[k]=(have[k]||0)+1;did(w);
  };
  if(r.cfg.snacks)station('goreng',r.fry,r.cfg.snackPool);
  station('barista',r.drk,r.cfg.drinkPool);
  if(S.pelayan&&r.cd.pelayan<=0){for(let i=0;i<r.seats.length;i++){if(serve(i,true)){did('pelayan');r.cd.pelayan=.8;break;}}}
}

/* ---------- End of level ---------- */
function endLevel(pass){
  if(run.ended)return;run.ended=true;
  const wages=STAFF.filter(s=>save.staff[s.id]).reduce((a,s)=>a+s.wage,0);
  save.money=Math.max(0,save.money+run.earned-wages);
  const lv=save.level;let stars=0;
  if(pass){const avg=run.ratios.reduce((a,b)=>a+b,0)/Math.max(1,run.ratios.length);
    stars=run.missed===0&&avg>=.5?3:run.missed<=1?2:1;save.level++;save.best=Math.max(save.best||0,lv);}
  persist();
  lastResult={pass,lv,stars,served:run.served,quota:run.cfg.quota,missed:run.missed,score:run.score,earned:run.earned,tips:run.tips,wages};
  show('result');
}

/* ---------- Keyed rendering (keeps animations alive) ---------- */
function patch(el,parts){
  while(el.children.length>parts.length)el.lastElementChild.remove();
  parts.forEach((h,i)=>{
    const c=el.children[i];if(c&&c._h===h)return;
    const t=document.createElement('template');t.innerHTML=h.trim();const n=t.content.firstElementChild;n._h=h;
    if(c)el.replaceChild(n,c);else el.appendChild(n);
  });
}
function setHtml(el,h){if(el._h!==h){el.innerHTML=h;el._h=h;}}
const prog={};
function applyProg(){
  document.querySelectorAll('[data-p]').forEach(e=>{const v=prog[e.dataset.p];if(v!=null)e.style.width=(Math.max(0,Math.min(1,v))*100).toFixed(1)+'%';});
  document.querySelectorAll('[data-ps]').forEach(e=>{const v=prog[e.dataset.ps];if(v!=null)e.style.transform=`scaleY(${Math.max(0,Math.min(1,v)).toFixed(3)})`;});
}

    <div class="actions">${pauseFrom?`<button class="btn green" data-act="resume">Kembali ke Dapur</button>`:`<button class="btn green" data-act="tut-done">Lanjut</button>`}</div>`;
  }
  else if(screen==='brief'){
    const cfg=levelCfg(save.level),hired=STAFF.filter(s=>save.staff[s.id]),base=levelCfg(1);
    const morePct=Math.round(Math.min(.45,p*.03)*100),lessPat=Math.round(Math.min(.35,p*.022)*100);
    h=`<p class="eyebrow">Hari ke-${save.level}</p><h2>Level ${save.level}</h2>
    <ul class="list">${levelNotes(save.level).map(n=>`<li>${n}</li>`).join('')}</ul>
    ${p>0?`<div class="note hot"><b>Popularitas ${'★'.repeat(ps)}${'☆'.repeat(5-ps)}</b><br>Fasilitas dan karyawanmu membuat warung makin terkenal: +${Math.floor(p/2)} pelanggan, datang ${morePct}% lebih rapat, kesabaran −${lessPat}%${cfg.vip?`, dan ${Math.round(cfg.vip*100)}% pelanggan adalah 👑 VIP (tidak sabaran, tapi tip 2×)`:''}.</div>`:''}
    <div class="receipt"><span>Target pelanggan</span><span>${cfg.quota}</span><span>Boleh kabur maksimal</span><span>${cfg.maxMiss-1}</span>
    <span>Kesabaran pelanggan</span><span>±${Math.round(cfg.patience*(1+.12*save.up.comfort))} detik</span>
    <span>Kompor · Wajan · Dispenser</span><span>${save.up.burner} · ${save.up.fryer} · ${save.up.drink}</span>
    <span>Karyawan</span><span>${hired.length?hired.map(s=>s.name).join(', '):'belum ada'}</span></div>
    <div class="actions"><button class="btn green" data-act="go">Buka Warung</button><button class="btn blue" data-act="shop">Toko &amp; Karyawan</button></div>`;
  }
  else if(screen==='result'){
    const R=lastResult;
    h=`<div class="hero">${person(look(R.pass?11:5),R.pass?'happy':'angry')}${registerArt(R.earned,R.served)}</div>
    <p class="eyebrow">Level ${R.lv} ${R.pass?'selesai':'gagal'}</p>
    <h2>${R.pass?'Warung tutup, pelanggan puas!':'Warung kewalahan'}</h2>
    ${R.pass?`<p class="stars" aria-label="${R.stars} dari 3 bintang">${'★'.repeat(R.stars)}<span class="off">${'★'.repeat(3-R.stars)}</span></p>`:`<p>${R.missed} pelanggan pergi sebelum dilayani. Coba lagi, atau belanja dulu di Toko.</p>`}
    <div class="receipt"><span>Pelanggan dilayani</span><span>${R.served} / ${R.quota}</span><span>Pelanggan kabur</span><span>${R.missed}</span><span>Skor</span><span>${R.score}</span>
    <span>Penjualan</span><span>${fmt(R.earned-R.tips)}</span><span>Tip</span><span>${fmt(R.tips)}</span><span>Gaji karyawan</span><span>− ${fmt(R.wages)}</span>
    <span class="tot">Saldo sekarang</span><span class="tot">${fmt(save.money)}</span></div>
    <div class="actions"><button class="btn green" data-act="next">${R.pass?'Lanjut ke Level '+save.level:'Coba Lagi Level '+save.level}</button><button class="btn blue" data-act="shop">Toko &amp; Karyawan</button></div>`;
  }
  else if(screen==='shop'){
    const rows=shopTab==='upg'?UPG.map(u=>{
      const cur=save.up[u.id],step=cur-u.start,maxed=cur>=u.max,cost=maxed?0:u.costs[step];
      const pips=Array.from({length:u.max-u.start+1},(_,j)=>`<i class="${j<=step?'on':''}"></i>`).join('');
      return `<div class="srow"><span class="ic">${u.art()}</span><span><b>${u.name}</b><small>${u.desc}</small>${maxed?'':'<small class="popc">+1 popularitas</small>'}<span class="pips">${pips}</span></span>
      ${maxed?`<button class="btn ghost" disabled>Maksimal</button>`:`<button class="btn green" data-act="buy" data-k="${u.id}" ${save.money<cost?'disabled':''}>Beli ${fmt(cost)}</button>`}</div>`;
    }).join(''):STAFF.map(s=>{
      const on=save.staff[s.id];
      return `<div class="srow"><span class="ic">${person(s.look,'happy',{chef:s.id!=='pelayan'})}</span><span><b>${s.name}</b><small>${s.desc}</small><small>Gaji ${fmt(s.wage)} per level</small>${on?'':'<small class="popc">+2 popularitas</small>'}</span>
      ${on?`<button class="btn ghost" data-act="fire" data-k="${s.id}">Berhentikan</button>`:`<button class="btn green" data-act="hire" data-k="${s.id}" ${save.money<s.hire?'disabled':''}>Rekrut ${fmt(s.hire)}</button>`}</div>`;
    }).join('');
    h=`<p class="eyebrow">Belanja setelah warung tutup</p><h2>Toko &amp; Karyawan</h2>
    <p>Saldo: <span class="money">${fmt(save.money)}</span></p>
    <div class="note hot">Popularitas sekarang ${'★'.repeat(ps)}${'☆'.repeat(5-ps)} (${p} poin). Setiap fasilitas dan karyawan baru membuat warung lebih terkenal, jadi pelanggan lebih banyak, datang lebih rapat, dan kurang sabar.</div>
    <div class="tabs" role="group"><button data-act="tab" data-k="upg" aria-pressed="${shopTab==='upg'}">Fasilitas</button><button data-act="tab" data-k="staff" aria-pressed="${shopTab==='staff'}">Karyawan</button></div>
    <div class="shop">${rows}</div>
    ${shopTab==='staff'?`<p class="note" style="margin-top:10px">Gaji dipotong dari pendapatan setiap level selesai. Karyawan bekerja otomatis, kamu tetap bisa ikut memasak.</p>`:''}
    <div class="actions"><button class="btn green" data-act="brief">Mulai Level ${save.level}</button></div>`;
  }
  else if(screen==='pause'){
    h=`<p class="eyebrow">Level ${run.cfg.n}</p><h2>Permainan dijeda</h2><p>Waktu berhenti, pelanggan ikut menunggu.</p>
    <div class="actions"><button class="btn green" data-act="resume">Lanjut Main</button><button class="btn ghost" data-act="tut-pause">Cara Main</button><button class="btn ghost" data-act="quit">Keluar ke Menu</button></div>
    <p class="note" style="margin-top:14px">Keluar ke menu membatalkan level ini. Uang dari level ini tidak disimpan.</p>`;
  }
  c.innerHTML=h;
}

/* ---------- Input ---------- */
const GAME=new Set(['boil','spice','dump','fry','drink','serve','discard']);
function act(el){
  const a=el.dataset.act,i=+el.dataset.i,k=el.dataset.k;ensureAudio();
  if(GAME.has(a)){
    if(!run||paused||run.ended||run.demo)return;
    if(a==='boil')boil(i);else if(a==='spice')season(i,+k);else if(a==='dump')run.burners[i]={st:'idle',t:0,dur:0};
    else if(a==='fry'){if(run.cfg.snacks)startSlot(run.fry[i],k);}else if(a==='drink')startSlot(run.drk[i],k);
    else if(a==='serve')serve(i,false);else if(a==='discard')run.hold.splice(i,1);
    renderAll();return;
  }
  switch(a){
    case 'sound':save.sound=!save.sound;persist();renderHud();break;
    case 'pause':if(run&&!run.demo&&!run.ended&&!paused){pauseFrom=null;show('pause');}break;
    case 'play':confirmReset=false;pauseFrom=null;show(save.tutorialSeen?'brief':'tutorial');break;
    case 'tut':pauseFrom=null;show('tutorial');break;
    case 'tut-pause':pauseFrom='pause';show('tutorial');break;
    case 'tut-done':save.tutorialSeen=true;persist();show('brief');break;
    case 'resume':pauseFrom=null;closeOv();break;
    case 'quit':demoRun();renderAll();show('title');break;
    case 'go':startLevel();break;
    case 'next':case 'brief':demoRun();renderAll();show('brief');break;
    case 'shop':show('shop');break;
    case 'tab':shopTab=k;renderScreen();break;
    case 'buy':{const u=UPG.find(x=>x.id===k),st=save.up[k]-u.start;if(save.up[k]<u.max&&save.money>=u.costs[st]){save.money-=u.costs[st];save.up[k]++;persist();beep(1200,.08);}renderScreen();renderHud();break;}
    case 'hire':{const s=STAFF.find(x=>x.id===k);if(!save.staff[k]&&save.money>=s.hire){save.money-=s.hire;save.staff[k]=true;persist();beep(1200,.08);}renderScreen();renderHud();break;}
    case 'fire':save.staff[k]=false;persist();renderScreen();break;
    case 'reset':confirmReset=true;renderScreen();break;
    case 'reset-no':confirmReset=false;renderScreen();break;
    case 'reset-yes':{const snd=save.sound;save=fresh();save.sound=snd;persist();confirmReset=false;demoRun();renderAll();show('title');break;}
  }
}
document.addEventListener('pointerdown',e=>{if(e.button!==0)return;const el=e.target.closest('[data-act]');if(!el||el.disabled||!GAME.has(el.dataset.act))return;e.preventDefault();act(el);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(GAME.has(el.dataset.act)&&e.detail!==0)return;act(el);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&run&&!run.demo&&!run.ended&&!paused)show('pause');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!run.demo&&!run.ended&&!paused)show('pause');});

/* ---------- Feedback ---------- */
let toastT=0;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800);}
function floatAt(id,text,cls){const el=$(id);if(!el)return;const rc=el.getBoundingClientRect();const f=document.createElement('div');f.className='float '+cls;f.textContent=text;f.style.left=(rc.left+rc.width/2)+'px';f.style.top=(rc.top+30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1400);}
let ac=null;
function ensureAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}else if(ac.state==='suspended')ac.resume().catch(()=>{});}
function beep(f,d){if(!save.sound||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.06);}catch(e){}}

/* ---------- Loop ---------- */
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(run&&!paused&&!run.ended&&!run.demo)update(dt);
  acc+=dt;if(acc>=.05){acc=0;if(!paused)renderAll();}
  requestAnimationFrame(loop);
}
demoRun();renderAll();show('title');requestAnimationFrame(loop);
})();
</script>
